name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check data files are valid JSON
        run: for f in data/*.json manifest.webmanifest; do python3 -m json.tool "$f" > /dev/null || exit 1; done

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js data icons _site/
          # Give each deploy its own offline cache so installed apps update.
          sed -i "s/const CACHE_VERSION = 'dev';/const CACHE_VERSION = '${GITHUB_SHA::7}';/" _site/sw.js
          grep -q "CACHE_VERSION = '${GITHUB_SHA::7}'" _site/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
